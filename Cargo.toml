[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[package]
name = "aoc-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aoc"
path = "src/main.rs"

[[bin]]
name = "setup"
path = "utils/setup.rs"

[dependencies]
aoc-common = { path = "crates/aoc-common" }
aoc-2022 = { path = "crates/aoc-2022" }
aoc-2025 = { path = "crates/aoc-2025" }
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
